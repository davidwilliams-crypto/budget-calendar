[package]
name = "budget-gui"
version = "0.9.0"
edition = "2021"
description = "Budget Calendar desktop UI (egui/eframe) on top of budget-core"

[dependencies]
budget-core = { path = "../budget-core" }
eframe = "0.31"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
egui-phosphor = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
aes-gcm = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
chrono-tz = "0.10"
